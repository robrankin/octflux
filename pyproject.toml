[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octflux"
version = "0.1.0"
description = "Configurable collector for Octopus Energy data, with pluggable storage/stream outputs and a control surface (REST + MCP)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.1",          # postgres: sync (alembic) + async (engine)
    "apscheduler>=3.11,<4",
    "structlog>=25",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.3",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "freezegun>=1.5",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
octflux = "octflux.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/octflux"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration", "tests/contracts", "tests/property", "tests/timescale"]
asyncio_mode = "auto"
markers = [
    "integration: exercises multiple real components",
    "contract: cross-implementation contract suites",
    "timescale: needs a real TimescaleDB (spun up via testcontainers)",
    "live: hits the real Octopus API or a real database (opt-in)",
]

[tool.coverage.run]
source = ["octflux"]

[tool.coverage.report]
# Enforced when coverage is requested (`pytest --cov=octflux`); the Timescale tier
# (`-m timescale`, testcontainers) lifts this further. Plain `pytest` skips coverage.
fail_under = 90
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
